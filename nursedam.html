<style>
:root{

}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Hahmlet',serif;color:var(--ink);background:#f7eee8;
  -webkit-tap-highlight-color:transparent;transition:color .8s}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));

h1,.serif{font-family:'Hahmlet',serif}

/* 처음 화면 */
#home{justify-content:safe center;gap:10px;overflow-y:auto;pointer-events:auto;padding-top:max(64px,env(safe-area-inset-top))}
.brand{font-size:44px;font-weight:700;letter-spacing:2px}
.tag{color:var(--soft);font-size:15px;margin-bottom:26px}
.ask{font-family:'Hahmlet',serif;font-size:21px;margin-bottom:14px}
.emos{display:grid;grid-template-columns:1fr;gap:10px;width:100%;max-width:340px}
@media (min-width:600px){.emos{grid-template-columns:1fr 1fr;max-width:680px}}
.emo{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:18px;padding:14px 18px;display:flex;gap:8px;
  justify-content:space-between;align-items:center;font-size:17px;text-align:left;transition:transform .2s,background .2s}
.emo span{white-space:nowrap}
@media (max-width:599px){ .emo{padding:9px 14px} .emos{gap:8px} .tag{margin-bottom:10px} .brand{font-size:38px} .ask{margin-bottom:6px} .link{margin-top:8px} #home .credit{margin-top:6px;line-height:1.5} }
#home .link{margin-top:14px} #home .credit{margin-top:8px;line-height:1.55}
.emo.wide{grid-column:1 / -1}
.emo:hover{transform:translateY(-2px);background:rgba(255,255,255,.9)}
.emo small{color:var(--soft);font-size:13px}
.emo .emoji{font-style:normal;font-size:20px;margin-right:8px;vertical-align:-2px}
.emo small{white-space:nowrap}
.emo .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:10px;vertical-align:middle}
.credit{margin-top:18px;font-size:12px;color:var(--soft);opacity:.75;letter-spacing:.5px}
.link{margin-top:22px;color:var(--soft);font-size:15px;text-decoration:underline;text-underline-offset:4px}

/* 공간 화면 */
.topbar{width:100%;max-width:640px;display:flex;justify-content:space-between;align-items:center}
.pill{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);

.mid{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding-top:9vh;align-items:center;gap:14px;max-width:520px}

.main-btn:hover{transform:translateY(-2px)}

  font-size:19px;color:#f4efe6;max-width:80vw;pointer-events:none;animation:drift 4s ease-in forwards}
@keyframes drift{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-120px) scale(.7);filter:blur(4px)}}

/* 정원 */
#garden .mid{justify-content:flex-start;padding-top:2vh;gap:8px}

.legend span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}

:root{ --ink:#221b31; --soft:#3b3350; --card:rgba(255,255,255,.9); --line:rgba(34,27,49,.2);

body{font-weight:500} /* 글씨체는 함렛 하나로 통일: 안내문은 500, 제목과 위로 문장은 700 */
h1,.ask,.line1,.gtitle,.panel-title,.letter,.rx-head,.rx-hero b,.emo span,.floatword{font-weight:700}
.tag,.ask,.place,.line1,.hint,.credit,.link,.gtitle,.legend,.brand{text-shadow:var(--halo)}
body:not(.dark) .line1,body.dark .hint{text-shadow:var(--halo)}
body.dark .hint{color:var(--soft)}
.tag{font-size:16px}
.place{font-size:15px;letter-spacing:.5px}
.line1{font-weight:700}
.hint{font-size:16px}
.emo small{font-size:14px}
.credit{font-size:13px;opacity:1}
.legend{font-size:14px}
.pill{font-size:15px}
.guest-chip{font-size:13px !important;padding:8px 12px !important;white-space:nowrap}
.guest-chip.done{background:rgba(255,236,170,.9);color:#5a4210}
.play-hint{margin-top:2px;font-size:14px}
.ghost{font-size:16px}
textarea::placeholder{color:rgba(255,255,255,.8)}
body:not(.dark) textarea::placeholder{color:#6a6180}
.main-btn{color:#fff;background:#d9788a;text-shadow:0 1px 2px rgba(0,0,0,.25)}
/* 작은 글씨: 그림자 없이 짙은 숲색 */
body.green #home .tag, body.green #home .ask, body.green #home .link, body.green #home .credit{
  color:#17382a; text-shadow:none}
/* 큰 제목만: 흰 글씨 + 짙은 테두리 + 그림자 */
body.green #home .brand{
  color:#fff;
  text-shadow:2px 2px 0 rgba(12,24,18,.9), -2px 2px 0 rgba(12,24,18,.9), 2px -2px 0 rgba(12,24,18,.9), -2px -2px 0 rgba(12,24,18,.9),
    0 2px 0 rgba(12,24,18,.9), 0 -2px 0 rgba(12,24,18,.9), 2px 0 0 rgba(12,24,18,.9), -2px 0 0 rgba(12,24,18,.9), 0 4px 10px rgba(0,0,0,.55)}
.credit .mail{color:inherit;font-size:inherit;font-weight:inherit;text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.credit .lab{color:inherit;text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.toast{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;
  background:rgba(23,56,42,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;pointer-events:none;animation:toast 1.8s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.panel{position:fixed;inset:0;z-index:20;background:rgba(30,28,40,.4);display:flex;align-items:center;justify-content:center;padding:16px}
.panel .box{background:#fffdf8;color:#221b31;border-radius:20px;width:min(520px,100%);max-height:84vh;overflow:auto;padding:20px 18px;text-align:left;text-shadow:none;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.panel-title{font-family:'Hahmlet',serif;font-size:20px;text-align:center}
.panel-sub{font-size:14px;color:#5a5270;text-align:center;margin:4px 0 10px}
.note-row{border-top:1px solid rgba(34,27,49,.12);padding:12px 0}
.note-row small{font-size:13px;color:#5a5270}
.note-row textarea{margin:6px 0;color:#221b31 !important;background:#fff !important;border:1px solid rgba(34,27,49,.2) !important}
.row-btns{display:flex;gap:8px;justify-content:flex-end}
.sm{padding:8px 16px;border-radius:999px;font-size:14px}
.sm.save{background:#d9805a;color:#fff}
.sm.del{background:#eee8e4;color:#5a5270}
.privacy{font-size:17px}
.line1{white-space:pre-line}
.hint,.care,.panel-sub{text-wrap:balance} /* 문구 안의 줄바꿈(
)을 그대로 보여 줌 */
#gProgress{border-radius:16px;line-height:1.55}
.gift-line{font-size:13px;color:#b5523f}
.letter{font-family:'Hahmlet',serif;font-size:17px;line-height:1.8;text-align:center;white-space:pre-line;margin:6px 0 4px;color:#221b31}
.letter span{display:block;text-wrap:balance;word-break:keep-all} /* 긴 줄은 두 줄로 고르게 나눔 */
.gift-preview{display:block;margin:4px auto 2px;border-radius:16px;background:radial-gradient(circle,#fff8ec 0%,#eef5e4 100%)}
.play-card{display:flex;align-items:center;gap:14px;border:1px solid rgba(34,27,49,.12);border-radius:16px;padding:14px;margin-top:10px;color:#221b31;text-decoration:none;background:#fff;transition:transform .15s}
.play-card:active{transform:scale(.98)}
.play-card .pi{font-size:34px;line-height:1;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.play-card b{display:block;font-family:'Hahmlet',serif;font-size:17px}
.play-card small{display:block;word-break:keep-all;font-size:13px;color:#5a5270;margin-top:3px;line-height:1.45}
.play-card .go{margin-left:auto;font-size:13px;color:#d9805a;font-weight:700;white-space:nowrap}
.gift-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid rgba(34,27,49,.12);padding:12px 2px}
.gift-row small{display:block;font-size:13px;color:#5a5270}
/* 마음 처방전 */
.rx-dot{display:none;width:8px;height:8px;border-radius:50%;background:#e8584a;margin-left:6px;vertical-align:2px}
.rx-dot.on{display:inline-block}
.rx{background:#fff;border:2px solid #2e5a46;border-radius:14px;padding:16px 16px 14px;position:relative;text-align:left;margin-top:6px}
.rx-head{text-align:center;font-family:'Hahmlet',serif;font-size:22px;letter-spacing:10px;color:#2e5a46;border-bottom:2px solid #2e5a46;padding-bottom:8px;margin-bottom:10px}
.rx-meta{display:flex;justify-content:space-between;font-size:13px;color:#5a5270;margin-bottom:10px;gap:8px}
.rx-row{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:9px 0;border-top:1px dashed rgba(46,90,70,.35);font-size:16px}
.rx-row b{color:#2e5a46}
.rx-stamp{position:absolute;right:14px;bottom:10px;width:72px;height:72px;border:3px solid rgba(214,70,60,.75);border-radius:50%;
  color:rgba(214,70,60,.8);font-size:12px;line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-14deg);font-family:'Hahmlet',serif}
.rx-foot{font-size:13px;color:#5a5270;margin-top:10px;text-align:center}
/* 숨은 손님 말풍선 */
.guest-bubble{position:fixed;z-index:25;max-width:230px;background:#fffdf8;color:#221b31;border-radius:16px;padding:10px 14px;font-size:15px;
  line-height:1.5;white-space:pre-line;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;text-shadow:none;animation:bubble 3.6s ease forwards}
@keyframes bubble{0%{opacity:0;transform:translateY(6px) scale(.9)}10%,82%{opacity:1;transform:none}100%{opacity:0}}
/* 첫 화면 주인공: 오늘의 처방전 카드 */
.rx-hero{position:relative;width:100%;max-width:320px;background:#fffdf8;color:#221b31;text-shadow:none;
  border:2px solid #2e5a46;border-radius:20px;padding:14px 16px 13px;display:flex;align-items:center;gap:12px;text-align:left;
  box-shadow:0 8px 24px rgba(23,56,42,.22);animation:rxPulse 2.6s ease-in-out infinite;margin-bottom:18px}
.rx-hero .rx-pill{font-size:38px;line-height:1;animation:rxWiggle 2.6s ease-in-out infinite}
.rx-hero b{display:block;font-family:'Hahmlet',serif;font-size:20px;color:#2e5a46}
.rx-hero small{display:block;font-size:14px;color:#5a5270;margin-top:3px}
.rx-hero .rx-dot{position:absolute;top:10px;right:12px;width:10px;height:10px;margin:0}
@keyframes rxPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes rxWiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-14deg)}90%{transform:rotate(12deg)}95%{transform:rotate(-6deg)}}
/* 저녁·밤 하늘에서는 작은 글씨를 밝게 */
body.green.home-dark #home .tag, body.green.home-dark #home .ask, body.green.home-dark #home .link, body.green.home-dark #home .credit{
  color:#fffaf0; text-shadow:0 1px 2px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.6)}
/* 첫 화면 아래 링크 두 개 */
.home-links{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
/* 숨은 손님 도감 */
.gb-sec{border-top:1px solid rgba(34,27,49,.12);padding:10px 0 4px}
.gb-place{font-family:'Hahmlet',serif;font-size:15px;color:#2e5a46;margin-bottom:6px}
.gb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gb-cell{background:#f6f1e8;border-radius:14px;padding:4px 4px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer}
.gb-cell.unknown{background:#efebf3;cursor:default}
.gb-cell b{font-size:14px;color:#221b31}.gb-cell.unknown b{color:#8a82a0}
.gb-cell small{font-size:11px;color:#7a7290}
.gb-cell .gb-line{font-size:12px;color:#4a4060;margin-top:4px;line-height:1.4}
/* 끝까지 내리면 언덕 위 내 꽃들이 보이도록 아래에 빈 자리 */
#home{padding-bottom:max(30vh,170px)}
#askLine{scroll-margin-top:max(60px,env(safe-area-inset-top))} /* 처방전을 닫고 내려올 때 위쪽 소리 버튼에 가리지 않게 */
/* 감정 카드: 폰에서 한 줄에 2개씩, 정사각형 */
.emos{grid-template-columns:1fr 1fr !important;max-width:320px !important;gap:10px !important}
@media (min-width:600px){.emos{grid-template-columns:repeat(4,1fr) !important;max-width:600px !important}}
.emo{aspect-ratio:1;flex-direction:column;justify-content:center;gap:4px;padding:10px 8px !important;text-align:center;border-radius:22px}
.emo span{white-space:normal;font-size:17px}
.emo .emoji{display:block;font-size:34px;margin:0 0 6px}
.emo small{white-space:normal;font-size:13px !important;line-height:1.35}
/* 아무말 대잔치: 감정 카드(8개) 아래에 따로 두는 대나무색 가로 카드 */
.vent-wrap{width:100%;max-width:320px;margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
@media (min-width:600px){.vent-wrap{max-width:600px}}
.vent-hint{font-size:14px;color:#17382a}
body.green.home-dark #home .vent-hint{color:#fffaf0;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6)}
.emo.vent{aspect-ratio:auto !important;width:100%;flex-direction:row !important;justify-content:space-between;gap:10px;padding:14px 18px !important;
  background:linear-gradient(135deg,#e4f1da,#c9e2bd);border:1.5px solid #6f9a64;text-align:left}
.emo.vent:hover{background:linear-gradient(135deg,#ecf6e4,#d3e9c8)}
.emo.vent .emoji{display:inline-block;position:relative;font-size:34px;margin:0 16px 0 0;vertical-align:-7px;transform-origin:60% 70%;animation:shout 2.6s ease-in-out infinite}
.emo.vent .emoji::after{content:'💥';position:absolute;right:-16px;top:-12px;font-size:19px;opacity:0;animation:boom 2.6s ease-out infinite}
@keyframes shout{0%,58%,100%{transform:rotate(0) scale(1)}63%{transform:rotate(-16deg) scale(1.2)}69%{transform:rotate(12deg) scale(1.2)}75%{transform:rotate(-8deg) scale(1.1)}82%{transform:rotate(0) scale(1)}}
@keyframes boom{0%,60%{opacity:0;transform:scale(.3)}68%{opacity:1;transform:scale(1.3)}84%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.emo.vent .emoji,.emo.vent .emoji::after{animation:none}.emo.vent .emoji::after{opacity:1}}
.emo.vent span{font-size:18px;color:#24402b} .emo.vent small{color:#3c5c3e;white-space:nowrap}
/* 지난 마음 돌아보기 */
.keep{display:flex;align-items:center;gap:8px;font-size:15px;pointer-events:auto;cursor:pointer;text-shadow:var(--halo)}
.keep input{width:18px;height:18px;accent-color:#d9788a}
.care{word-break:keep-all}
.care{font-size:13px;line-height:1.5;color:var(--soft);text-shadow:var(--halo)}
.care a{color:inherit;text-decoration:underline;text-underline-offset:3px;pointer-events:auto}
body.green .main-btn{background:#d9805a;box-shadow:0 6px 20px rgba(217,128,90,.35)}

<body>
<canvas id="bg"></canvas>

<!-- 처음 화면 -->
<section class="screen on" id="home">
  <button class="pill soundBtn" style="position:fixed;top:max(16px,env(safe-area-inset-top));right:16px">♪ 소리 켜짐</button>
  <h1 class="brand">널쓰담</h1>
  <p class="tag">너를 쓰다듬다 · Nurse를 담다</p>
  <button class="rx-hero" id="rxBtn"><span class="rx-pill">💊</span><span><b>오늘의 마음 처방전</b><small>눌러서 처방 받기 →</small></span><i class="rx-dot" id="rxDot"></i></button>
  <p class="ask" id="askLine">오늘 마음은 어때요?</p>
  <div class="emos" id="emos"></div>
  <div class="vent-wrap"><p class="vent-hint">속 시원하게 외치고 싶을 땐</p><div id="ventSlot" style="width:100%"></div></div>
  <div class="home-links"><button class="link" id="toGarden">🌱 내 마음 정원 보기</button><button class="link" id="toBook">🐾 숨은 손님 도감</button><button class="link" id="toPlay">🎮 놀이터</button></div>
  <p class="credit">Created by <a class="lab" href="https://nursing.ai.kr" target="_blank" rel="noopener">해안AI간호교육연구소</a><br>문의: <button class="mail" id="mailCopy" title="누르면 주소가 복사돼요">naya5403@naver.com</button></p>
</section>

<!-- 감정 공간 -->
<section class="screen" id="space">
  <div class="topbar">
    <button class="pill" id="back">← 처음으로</button>
    <button class="pill guest-chip" id="guestChip" title="누르면 숨은 손님 도감이 열려요">🐾 손님 0/3</button>
    <button class="pill soundBtn" id="soundBtn">♪ 소리 켜짐</button>
  </div>
  <div class="mid">
    <p class="place" id="placeName"></p>
    <p class="line1" id="line1"></p>
    <p class="hint" id="hint"></p>
  </div>
  <div class="bottom" id="actions"></div>
  <p class="credit" style="margin-top:10px">Created by <a class="lab" href="https://nursing.ai.kr" target="_blank" rel="noopener">해안AI간호교육연구소</a></p>
</section>

<!-- 마음 정원 -->
<section class="screen" id="garden">
  <div class="topbar">
    <button class="pill" id="gBack">← 처음으로</button>
    <button class="pill" id="gCount">피운 꽃 0송이</button>
  </div>
  <div class="mid">
    <p class="gtitle">마음 정원</p>
    <p class="line1" id="gMsg" style="font-size:18px"></p>
    <p class="hint" style="line-height:1.7">하루에 두 번 물을 줄 수 있어요.<br>물을 세 번 주면 꽃이 피고,<br>꽃잎은 물 준 날의 마음 색으로 칠해져요.</p>
    <p class="pill pass" id="gProgress" style="font-size:14px"></p>
  </div>
  <div class="bottom">
    <button class="main-btn" id="waterBtn">물 주기</button>
    <div class="legend" id="legend"></div>
  </div>
  <p class="credit" style="margin-top:10px">Created by <a class="lab" href="https://nursing.ai.kr" target="_blank" rel="noopener">해안AI간호교육연구소</a></p>
</section>

<script>
/* ===== 기본 설정 ===== */
const $ = s => document.querySelector(s);
const EMO = {
  hurt:    {label:'속상해요', emoji:'😢', scene:'sea',    place:'밤바다',            color:'#b49fde'},
  tired:   {label:'지쳤어요', emoji:'😩', scene:'rain',   place:'비 오는 창가',      color:'#93b4dc'},
  anxious: {label:'불안해요', emoji:'😟', scene:'candle', place:'촛불 하나 켜진 방', color:'#f2b066'},
  angry:   {label:'화나요', emoji:'😠',   scene:'hill',   place:'바람 부는 숲',    color:'#e8796f'},
  lonely:  {label:'외로워요', emoji:'🥺', scene:'roof',   place:'별이 뜨는 지붕 위', color:'#6fc0b0'},
  selfhate:{label:'내가 미워요', emoji:'😞', scene:'lake', place:'민들레 들판',     color:'#a3c46b'},
  sad:     {label:'슬퍼요', emoji:'😭',   scene:'blanket', place:'토닥토닥 담요 속', color:'#c9a07e'},
  good:    {label:'괜찮아요·좋아요', emoji:'😊', scene:'yard', place:'햇살 드는 마당', color:'#f2d55a'},
  vent:    {label:'아무말 대잔치', emoji:'📣', scene:'bamboo', place:'대나무숲', color:'#4f8a4b'},
};
const NEUTRAL = '#f2a3b3';
const colorOf = k => (EMO[k] ? EMO[k].color : NEUTRAL);
const TEST = new URLSearchParams(location.search).has('test'); // ?test 를 붙이면 하루에 여러 번 물 주기 가능

let todayEmo = null;
let soundOn = true;
try { soundOn = localStorage.getItem('nursdam_sound') !== 'off'; } catch(e){}

/* ===== 저장 (이 기기 안에만 저장) ===== */
const KEY = 'nursdam_garden_v1';
function loadG(){
  try { const g = JSON.parse(localStorage.getItem(KEY)); if (g && Array.isArray(g.seed)) return g; } catch(e){}
  return {seed:[], flowers:[], last:null, visit:null, gifts:[]};
}
function saveG(){ try { localStorage.setItem(KEY, JSON.stringify(G)); } catch(e){} }
let G = loadG();
if (!Array.isArray(G.gifts)) G.gifts = []; // 예전에 저장된 정원에는 선물 기록이 없음
const dayStr = d => d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const today = () => dayStr(new Date());
function daysBetween(a, b){
  if (!a) return 0;
  const p = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  return Math.round((p(b) - p(a)) / 864e5);
}

/* ===== 그림판 ===== */
const cv = $('#bg'); let ctx = cv.getContext('2d'); // let: 꽃다발 그림을 다른 캔버스에 그릴 때 잠시 바꿔 씀
const fog = document.createElement('canvas'), fctx = fog.getContext('2d');
let W = 0, H = 0, scene = 'home', S = {};
function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  fog.width = W; fog.height = H;
  fctx.fillStyle = '#d4dbe6'; fctx.fillRect(0,0,W,H);
  buildScene();
}
const rnd = (a,b) => a + Math.random()*(b-a);
const ease = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;

function buildScene(){
  const m = Math.min(W,H);
  S.bokeh = Array.from({length:22}, () => ({x:rnd(0,W), y:rnd(H*.3,H*.9), r:rnd(m*.02,m*.07),
    c:['255,200,130','255,170,120','200,220,255','255,230,170'][Math.floor(rnd(0,4))], ph:rnd(0,6)}));
  S.streaks = Array.from({length:110}, () => ({x:rnd(0,W*1.1), y:rnd(-H,H), v:rnd(500,900), l:rnd(12,26)}));
  S.drops = Array.from({length:Math.round(W*H/9000)}, () => newDrop(true));
  S.stars = Array.from({length:120}, () => ({x:rnd(0,W), y:rnd(0,H*.52), r:rnd(.4,1.5), ph:rnd(0,6)}));
  S.clouds = Array.from({length:4}, (_,i) => ({x:rnd(0,W), y:rnd(H*.06,H*.3), s:rnd(.7,1.3), v:rnd(4,10)}));
  // 숲: 멀리 → 가까이 세 겹의 나무
  S.forest = [
    {color:'#8e9a9c', base:.64, hmin:.10, hmax:.17, gap:34, amp:.5},
    {color:'#6a8565', base:.72, hmin:.17, hmax:.28, gap:52, amp:.75, hi:'rgba(175,205,140,.16)'},
    {color:'#35503a', base:.82, hmin:.28, hmax:.44, gap:95, amp:1, hi:'rgba(140,185,110,.2)'},
  ].map(l => {
    const n = Math.ceil(W/l.gap) + 2;
    return {...l, trees: Array.from({length:n}, (_, i) => ({x:(i - .5 + rnd(-.3,.3))*l.gap, h:H*rnd(l.hmin,l.hmax),
      w:rnd(.34,.46), pine:Math.random() < .55, ph:rnd(0,6)}))};
  });
  S.blades = Array.from({length:Math.round(W/2)}, () => ({x:rnd(-10,W+10), h:rnd(20,50), w:rnd(2,4), c:Math.floor(rnd(0,3)), ph:rnd(0,6), dy:rnd(0,10)}));
  S.leaves = [];
  S.houses = []; for (let x = -20; x < W; ){
    const w = rnd(50,95), h = rnd(H*.07,H*.16);
    const wins = Array.from({length:Math.floor(rnd(1,4))}, () => ({dx:rnd(.15,.7)*w, dy:rnd(.25,.7)*h, on:Math.random() < .55}));
    S.houses.push({x, w, h, roof:rnd(14,30), wins}); x += w + rnd(-6,10);
  }
  S.lit = S.lit || [];
  S.dande = Array.from({length:Math.round(W/34)}, () => ({x:rnd(0,W), k:Math.pow(Math.random(), .8), h:rnd(30,60), ph:rnd(0,6), yellow:Math.random() < .3}))
    .sort((a, b) => a.k - b.k); // 먼 것부터 그려서 가까운 것이 앞에
  S.snow = Array.from({length:70}, () => ({x:rnd(0,W), y:rnd(0,H), r:rnd(1,2.6), v:rnd(12,30), ph:rnd(0,6)}));
  const PC = HOME_THEMES[homeTheme].petals;
  S.petals = Array.from({length:32}, () => ({x:rnd(0,W), y:rnd(-H,H), vy:rnd(18,40), vx:rnd(8,22), rot:rnd(0,6), vr:rnd(-1.2,1.2),
    sz:rnd(7,13), c:PC[Math.floor(rnd(0,PC.length))], ph:rnd(0,6)}));
  S.bflies = [0,1].map(k => ({k, c:k ? '#f7b2c4' : '#b9a6ec'}));
  // 대나무숲: 멀리 → 가까이 세 겹의 대나무
  S.bamboo = [
    {c:'#6f9a78', n:Math.ceil(W/26), w:[5,8], a:.45},
    {c:'#4e7f57', n:Math.ceil(W/40), w:[8,12], a:.7},
    {c:'#2f5a3a', n:Math.ceil(W/70), w:[12,18], a:1},
  ].map(l => ({...l, st:Array.from({length:l.n}, () => ({x:rnd(-20,W+20), w:rnd(...l.w), seg:rnd(46,80), ph:rnd(0,6)}))}));
  S.boats = S.boats || [];
  S.spark = S.spark || [];
  S.rainfx = S.rainfx || [];
}
function newDrop(any){
  return {x:rnd(0,W), y:any?rnd(0,H):rnd(-20,H*.3), r:rnd(1.5,4.5), vy:0, slide:false};
}

/* --- 비 오는 창가 --- */
function drawRain(t, dt){
  let g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2f3a52'); g.addColorStop(1,'#56637c');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  for (const b of S.bokeh){
    const a = .22 + .1*Math.sin(t*.6 + b.ph);
    const rg = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    rg.addColorStop(0,`rgba(${b.c},${a})`); rg.addColorStop(1,`rgba(${b.c},0)`);
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(205,218,238,.28)'; ctx.lineWidth = 1; ctx.beginPath();
  for (const s of S.streaks){
    s.y += s.v*dt; s.x -= s.v*dt*.08;
    if (s.y > H){ s.y = rnd(-60,-10); s.x = rnd(0,W*1.1); }
    ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.l*.08, s.y+s.l);
  }
  ctx.stroke();
  // 김 서린 유리: 천천히 다시 뿌옇게
  fctx.globalCompositeOperation = 'source-over';
  fctx.fillStyle = 'rgba(212,219,230,.004)'; fctx.fillRect(0,0,W,H);
  // 흘러내리는 물방울
  fctx.globalCompositeOperation = 'destination-out'; fctx.lineCap = 'round';
  for (let i=0;i<S.drops.length;i++){
    const d = S.drops[i];
    if (!d.slide && d.r > 3 && Math.random() < .0015) d.slide = true;
    if (d.slide){
      const py = d.y; d.vy = Math.min(d.vy + 60*dt, 140); d.y += d.vy*dt; d.x += Math.sin(d.y*.05)*.3;
      fctx.lineWidth = d.r*1.4; fctx.beginPath(); fctx.moveTo(d.x,py); fctx.lineTo(d.x,d.y); fctx.stroke();
      if (d.y > H+10) S.drops[i] = newDrop(false);
    }
  }
  fctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = .5; ctx.drawImage(fog,0,0,W,H); ctx.globalAlpha = 1;
  for (const d of S.drops){
    ctx.fillStyle = 'rgba(235,242,255,.16)'; ctx.strokeStyle = 'rgba(255,255,255,.32)'; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.ellipse(d.x,d.y,d.r,d.r*(d.slide?1.25:1),0,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.arc(d.x-d.r*.35,d.y-d.r*.35,d.r*.28,0,7); ctx.fill();
  }
  // 창틀
  const f = Math.max(14, Math.min(W,H)*.035);
  ctx.fillStyle = '#3b2c27';
  ctx.fillRect(0,0,W,f); ctx.fillRect(0,0,f,H); ctx.fillRect(W-f,0,f,H);
  ctx.fillRect(W/2-f*.4,0,f*.8,H); ctx.fillRect(0,(W < H ? H*.52 : H*.36)-f*.4,W,f*.8);
  ctx.fillStyle = '#4c3a33'; ctx.fillRect(0,H-f*1.6,W,f*1.6);
  ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(0,H-f*1.6,W,3);
}
let lastPt = null;
cv.addEventListener('pointerdown', e => {
  if (guestHit(e.clientX, e.clientY)) return; // 숨은 손님을 눌렀으면 다른 동작은 하지 않음
  if (scene==='rain'){ lastPt = {x:e.clientX,y:e.clientY}; wipe(e); }
  if (scene==='roof' && e.clientY < H*.78) lightStar(e.clientX, e.clientY);
  if (scene==='blanket') doPat();
});
cv.addEventListener('pointermove', e => { if (scene==='rain' && lastPt) wipe(e); });
addEventListener('pointerup', () => lastPt = null);
function wipe(e){
  fctx.globalCompositeOperation = 'destination-out'; fctx.lineCap = 'round'; fctx.lineJoin = 'round';
  fctx.lineWidth = 24; fctx.beginPath(); fctx.moveTo(lastPt.x,lastPt.y); fctx.lineTo(e.clientX,e.clientY); fctx.stroke();
  fctx.globalCompositeOperation = 'source-over';
  lastPt = {x:e.clientX,y:e.clientY};
}

/* --- 밤바다 --- */
function drawSea(t, dt){
  const hy = H*.56, m = Math.min(W,H);
  let g = ctx.createLinearGradient(0,0,0,hy);
  g.addColorStop(0,'#0c1230'); g.addColorStop(1,'#2b3766');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,hy);
  for (const s of S.stars){
    ctx.fillStyle = `rgba(255,250,235,${.35+.35*Math.sin(t*1.3+s.ph)})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
  }
  const mx = W*.72, my = W < H ? H*.4 : H*.2, mr = m*.065; // 세로 화면에서는 글자와 겹치지 않게 아래쪽에
  let rg = ctx.createRadialGradient(mx,my,mr*.8,mx,my,mr*5);
  rg.addColorStop(0,'rgba(255,240,205,.32)'); rg.addColorStop(1,'rgba(255,240,205,0)');
  ctx.fillStyle = rg; ctx.fillRect(0,0,W,hy);
  ctx.fillStyle = '#fff4d6'; ctx.beginPath(); ctx.arc(mx,my,mr,0,7); ctx.fill();
  g = ctx.createLinearGradient(0,hy,0,H);
  g.addColorStop(0,'#1f2a55'); g.addColorStop(1,'#080c22');
  ctx.fillStyle = g; ctx.fillRect(0,hy,W,H-hy);
  const rows = 18;
  for (let i=0;i<rows;i++){
    const k = i/rows, y = hy + Math.pow(k,1.7)*(H-hy), amp = 1 + k*9;
    ctx.strokeStyle = `rgba(170,190,255,${.05+k*.12})`; ctx.lineWidth = .6 + k*1.2;
    ctx.beginPath();
    for (let x=0;x<=W;x+=12){
      const yy = y + Math.sin(x*.012/(k+.3) + t*(.6+k*.5) + i)*amp;
      x ? ctx.lineTo(x,yy) : ctx.moveTo(x,yy);
    }
    ctx.stroke();
    // 달빛 반사
    const w = (20 + k*90) * (.7 + .3*Math.sin(t*2 + i*1.7));
    ctx.fillStyle = `rgba(255,236,190,${.18+.25*(1-k)})`;
    ctx.fillRect(mx - w/2 + Math.sin(t*1.5+i)*8, y, w, 1.5 + k*2.5);
  }
  // 종이배
  for (const b of S.boats){
    b.p += dt/14;
    const p = ease(Math.min(1,b.p));
    const y = H*.66 + (hy+6 - H*.66)*p + Math.sin(t*1.6+b.ph)*4*(1-p);
    const x = b.x0 + (b.x1-b.x0)*p + Math.sin(t*.7+b.ph)*10*(1-p);
    const s = (1-p*.88) * Math.min(1.2, m/500);
    const a = b.p < .8 ? 1 : Math.max(0, 1-(b.p-.8)/.2);
    ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*1.8+b.ph)*.08); ctx.scale(s,s); ctx.globalAlpha = a;
    ctx.fillStyle = '#f6f1e6';
    ctx.beginPath(); ctx.moveTo(-34,-4); ctx.lineTo(34,-4); ctx.lineTo(22,10); ctx.lineTo(-22,10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e6dfd0';
    ctx.beginPath(); ctx.moveTo(-14,-4); ctx.lineTo(4,-38); ctx.lineTo(18,-4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,236,190,.25)'; ctx.fillRect(-26,12,52,2);
    ctx.restore();
  }
  S.boats = S.boats.filter(b => b.p < 1);
}

/* --- 촛불 --- */
let breath = null; // {start}
const B_IN = 5, B_OUT = 7, B_CYC = B_IN + B_OUT; // 들이쉬기 5초, 내쉬기 7초
function flameScale(t){
  if (!breath) return 1 + Math.sin(t*3)*.03;
  const p = ((t - breath.start) % B_CYC);
  return p < B_IN ? .3 + 2.9*ease(p/B_IN) : 3.2 - 2.9*ease((p-B_IN)/B_OUT); // 작은 불꽃 0.3배 ↔ 큰 불꽃 3.2배
}
function drawCandle(t){
  const cx = W/2, base = H*.88, m = Math.min(W,H), u = Math.min(1.2, m/520);
  const f = flameScale(t), fg = Math.min(f, 2.4), flick = Math.sin(t*9)*.6 + Math.sin(t*13.7)*.4;
  ctx.fillStyle = '#140d0b'; ctx.fillRect(0,0,W,H);
  const fy = base - 150*u - 30*u*f;
  let rg = ctx.createRadialGradient(cx,fy,0,cx,fy,Math.max(W,H)*.55*(.6+.4*fg));
  rg.addColorStop(0,`rgba(255,176,92,${.22+.22*fg})`); rg.addColorStop(.4,`rgba(170,90,50,${.06+.1*fg})`); rg.addColorStop(1,'rgba(20,13,11,0)');
  ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  // 탁자
  ctx.fillStyle = '#24170f'; ctx.fillRect(0,base,W,H-base);
  rg = ctx.createRadialGradient(cx,base,0,cx,base,240*u*f);
  rg.addColorStop(0,'rgba(255,170,90,.22)'); rg.addColorStop(1,'rgba(255,170,90,0)');
  ctx.fillStyle = rg; ctx.fillRect(0,base,W,H-base);
  // 초
  const cw = 46*u, ch = 100*u; // 불꽃이 커져도 글씨에 닿지 않게 초를 낮게
  let g = ctx.createLinearGradient(cx-cw/2,0,cx+cw/2,0);
  g.addColorStop(0,'#d9c8a8'); g.addColorStop(.45,'#f7ecd6'); g.addColorStop(1,'#bfa98a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx-cw/2, base-ch, cw, ch, 6*u) : ctx.rect(cx-cw/2, base-ch, cw, ch); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,160,.35)'; ctx.beginPath(); ctx.ellipse(cx, base-ch, cw/2, 5*u, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2a1d16'; ctx.lineWidth = 2*u; ctx.beginPath(); ctx.moveTo(cx, base-ch); ctx.lineTo(cx, base-ch-10*u); ctx.stroke();
  // 불꽃
  const fh = 58*u*f, fw = 15*u*(.55+.45*f), top = base-ch-8*u, sway = flick*2*u;
  g = ctx.createRadialGradient(cx, top-fh*.3, 0, cx, top-fh*.3, fh);
  g.addColorStop(0,'rgba(255,255,240,1)'); g.addColorStop(.3,'rgba(255,224,130,.95)');
  g.addColorStop(.7,'rgba(255,140,50,.6)'); g.addColorStop(1,'rgba(255,100,30,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(cx, top+4*u);
  ctx.bezierCurveTo(cx+fw, top, cx+fw*.7, top-fh*.6, cx+sway, top-fh);
  ctx.bezierCurveTo(cx-fw*.7, top-fh*.6, cx-fw, top, cx, top+4*u);
  ctx.fill();
  ctx.fillStyle = 'rgba(120,160,255,.35)'; ctx.beginPath(); ctx.ellipse(cx, top, fw*.35, 4*u, 0, 0, 7); ctx.fill();
}

/* --- 바람 부는 언덕 (화나요) --- */
const wind = {lv:0, hold:false, peak:0, said:''};
function drawTree(tr, by, sway, hi){
  const h = tr.h;
  ctx.save(); ctx.translate(tr.x, by); ctx.transform(1, 0, -sway, 1, 0, 0); // 위로 갈수록 바람 방향으로 기울어짐
  const base = ctx.fillStyle;
  ctx.beginPath();
  if (tr.pine){
    ctx.rect(-h*.025, -h*.16, h*.05, h*.16);
    for (let k=0;k<4;k++){
      const yb = -h*(.1 + k*.2), yt = yb - h*.36, half = h*tr.w*.5*(1 - k*.2);
      ctx.moveTo(-half, yb); ctx.lineTo(0, yt); ctx.lineTo(half, yb);
    }
  } else {
    ctx.rect(-h*.03, -h*.5, h*.06, h*.5);
    for (const [cx, cy, r] of [[0,-.62,.26],[-.17,-.5,.2],[.17,-.5,.2],[0,-.82,.18],[-.1,-.72,.17],[.12,-.7,.17]]){
      ctx.moveTo(cx*h + r*h, cy*h); ctx.arc(cx*h, cy*h, r*h, 0, 7);
    }
  }
  ctx.fill();
  if (hi){ // 해 쪽(오른쪽 위)으로 비치는 밝은 면
    ctx.fillStyle = hi; ctx.beginPath();
    if (tr.pine){
      for (let k=0;k<4;k++){
        const yb = -h*(.1 + k*.2), yt = yb - h*.36, half = h*tr.w*.5*(1 - k*.2);
        ctx.moveTo(0, yt + h*.03); ctx.lineTo(half*.92, yb - h*.01); ctx.lineTo(half*.25, yb - h*.01);
      }
    } else {
      for (const [cx, cy, r] of [[.06,-.68,.17],[.2,-.54,.12],[.05,-.86,.11],[.17,-.74,.11]]){
        ctx.moveTo(cx*h + r*h, cy*h); ctx.arc(cx*h, cy*h, r*h, 0, 7);
      }
    }
    ctx.fill(); ctx.fillStyle = base;
  }
  ctx.restore();
}
function drawHill(t, dt){
  wind.lv = Math.max(0, Math.min(1, wind.lv + (wind.hold ? .55 : -.16)*dt));
  wind.peak = Math.max(wind.peak, wind.lv);
  const L = wind.lv, m = Math.min(W,H);
  let g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#525f8c'); g.addColorStop(.45,'#d98f86'); g.addColorStop(.7,'#f3c49a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const sx = W*.7, sy = H*.55;
  const rg = ctx.createRadialGradient(sx,sy,0,sx,sy,m*.5);
  rg.addColorStop(0,'rgba(255,226,180,.8)'); rg.addColorStop(1,'rgba(255,226,180,0)');
  ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#ffe6bd'; ctx.beginPath(); ctx.arc(sx,sy,m*.06,0,7); ctx.fill();
  ctx.fillStyle = 'rgba(255,232,224,.5)';
  for (const c of S.clouds){
    c.x += (c.v + L*160)*dt; if (c.x > W+120) c.x = -140;
    for (const [dx,dy,r] of [[0,0,22],[26,-6,18],[50,0,20]]){
      ctx.beginPath(); ctx.ellipse(c.x+dx*c.s, c.y+dy*c.s, r*c.s*1.6, r*c.s*.7, 0, 0, 7); ctx.fill();
    }
  }
  // 먼 산
  ctx.fillStyle = 'rgba(128,128,158,.55)';
  ctx.beginPath(); ctx.moveTo(0,H);
  for (let x=0;x<=W+20;x+=20) ctx.lineTo(x, H*.6 - Math.sin(x*.006)*H*.05 - Math.sin(x*.017+1)*H*.02);
  ctx.lineTo(W,H); ctx.fill();
  // 세 겹의 숲: 가까운 나무일수록 크게 흔들림
  S.forest.forEach((l, li) => {
    const by = H*l.base;
    ctx.fillStyle = l.color;
    for (const tr of l.trees){
      const sway = (Math.sin(t*(.9 + L*2.4) + tr.ph)*(.02 + L*.06) + L*.14) * l.amp;
      drawTree(tr, by, sway, l.hi);
    }
    ctx.fillRect(0, by - 1, W, H - by + 1);
    if (li < 2){ ctx.fillStyle = 'rgba(243,196,160,.16)'; ctx.fillRect(0, 0, W, H); } // 멀리 있는 숲에 노을빛 안개
  });
  // 앞쪽 풀숲
  const fy = H*.86;
  ctx.fillStyle = '#2c4430'; ctx.fillRect(0, fy, W, H - fy);
  ['#355a37','#46703f','#5a854b'].forEach((c, ci) => {
    ctx.fillStyle = c; ctx.beginPath();
    for (const b of S.blades) if (b.c === ci){
      const y = fy + b.dy, bend = (Math.sin(t*(1.6 + L*5) + b.ph)*(.08 + L*.15) + L*.55) * b.h;
      ctx.moveTo(b.x - b.w, y);
      ctx.quadraticCurveTo(b.x - b.w*.3 + bend*.4, y - b.h*.55, b.x + bend, y - b.h*(1 - L*.25));
      ctx.quadraticCurveTo(b.x + b.w*.3 + bend*.4, y - b.h*.55, b.x + b.w, y);
    }
    ctx.fill();
  });
  // 날리는 나뭇잎
  if (L > .15 && Math.random() < L*.7)
    S.leaves.push({x:-10, y:rnd(H*.15,H*.8), vx:rnd(220,420), vy:rnd(-40,40), r:rnd(0,6),
      c:['#8fae5a','#c9a24a','#d9824a','#6f9a4f'][Math.floor(rnd(0,4))]});
  for (const f of S.leaves){
    f.x += f.vx*dt*(.4 + L); f.y += f.vy*dt + Math.sin(t*3 + f.r);
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(t*4 + f.r); ctx.scale(1, Math.cos(t*6 + f.r));
    ctx.fillStyle = f.c;
    ctx.beginPath(); ctx.moveTo(-6,0); ctx.quadraticCurveTo(0,-4,6,0); ctx.quadraticCurveTo(0,4,-6,0); ctx.fill(); ctx.restore();
  }
  S.leaves = S.leaves.filter(f => f.x < W+20);
  if (S.wbp){
    S.wbp.frequency.setTargetAtTime(260 + L*900, AC.currentTime, .1);
    S.wg.gain.setTargetAtTime(.05 + L*.55, AC.currentTime, .1);
  }
  // 글자
  let s = null;
  if (wind.hold) s = L > .9 ? '다 쏟아내도 괜찮아요.' : '바람이 세지고 있어요.';
  else if (wind.peak > .3 && L > 0) s = '바람이 잦아들고 있어요.';
  else if (wind.peak > .3){
    s = '숲이 다시 조용해졌어요.|숨 한번 크게 쉬어요.'; wind.peak = 0;
    const said = s;
    setTimeout(() => { if (scene === 'hill' && !wind.hold && wind.said === said){ wind.said = HILL_LINES[hillI++ % HILL_LINES.length]; setLine(wind.said);
      const act = document.getElementById('actions'); if (!act.querySelector('.play-hint')) act.append(playHint('🎮 기분 전환이 필요하면, 놀이터도 있어요')); } }, 5000);
  }
  if (s && s !== wind.said){ wind.said = s; setLine(s); }
}

function drawRoof(t){

const GOODKEY = 'nursdam_good_v1';
function loadGood(){ try { const a = JSON.parse(localStorage.getItem(GOODKEY)); if (Array.isArray(a)) return a; } catch(e){} return []; }
let GOOD = loadGood();
function saveGood(){ try { localStorage.setItem(GOODKEY, JSON.stringify(GOOD.slice(-200))); } catch(e){} }
function wrapText(text, maxW, maxLines){
  const lines = []; let cur = '';
  for (const ch of text){
    if (ctx.measureText(cur + ch).width > maxW){ lines.push(cur); cur = ch; if (lines.length === maxLines) break; }
    else cur += ch;
  }
  if (lines.length < maxLines) lines.push(cur);
  else { const last = lines[maxLines-1]; lines[maxLines-1] = last.slice(0, -1) + '…'; }
  return lines;
}
function drawYard(t, dt){
  let g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#bfe2f2'); g.addColorStop(.7,'#fff1d6'); g.addColorStop(1,'#fff1d6');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const sx = W*.14, sy = H*.11, m = Math.min(W,H);
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(t*.05);
  ctx.strokeStyle = 'rgba(255,214,130,.35)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (let i=0;i<12;i++){ ctx.rotate(Math.PI/6); ctx.beginPath(); ctx.moveTo(m*.09,0); ctx.lineTo(m*.15,0); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = '#ffe49a'; ctx.beginPath(); ctx.arc(sx,sy,m*.065,0,7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (const c of S.clouds){

  }
  const gy = H*.8;

  ctx.beginPath(); ctx.moveTo(0,gy); ctx.quadraticCurveTo(W*.5,gy-24,W,gy); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
  // 빨랫줄

  ctx.beginPath(); ctx.moveTo(p1, y0); ctx.quadraticCurveTo(W/2, y0 + sag*2, p2, y0); ctx.stroke();

  notes.forEach((nt, i) => {
    const x = p1 + (p2-p1)*(i+1)/(n+1), u = (x-p1)/(p2-p1);
    const y = y0 + sag*4*u*(1-u);
    let drop = 0, a = 1;
    if (i === n-1 && S.noteBorn){ const k = Math.min(1, (performance.now() - S.noteBorn)/700); drop = (1-ease(k))*-40; a = k; }
    ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y + drop); ctx.rotate(Math.sin(t*1.2 + i*1.7)*.05);
    ctx.fillStyle = 'rgba(120,90,60,.12)'; ctx.fillRect(-cw/2+3, 5, cw, ch);
    ctx.fillStyle = ['#fffaf0','#fff4f4','#f4fbff','#fbfff2'][i%4]; ctx.fillRect(-cw/2, 2, cw, ch);
    ctx.fillStyle = '#e59aa6'; ctx.fillRect(-4, -6, 8, 16);
    ctx.fillStyle = '#2e2618';
    wrapText(nt.text, cw-16, 3).forEach((ln, k) => ctx.fillText(ln, 0, 14 + k*18));
    ctx.restore();
  });
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  for (const b of S.bflies){
    const x = W*(.5 + .38*Math.sin(t*.11 + b.k*2.3)), y = H*(.62 + .1*Math.sin(t*.37 + b.k*4));

    ctx.fillStyle = '#5a4e3c'; ctx.fillRect(x-1, y-5, 2, 10);
  }
}

  }

function doPat(){

const SHAPES = ['둥근 꽃', '별꽃', '벚꽃', '튤립', '겹꽃', '수국'];
const SHAPE_ORDER = [0, 2, 3, 1, 5, 4];
const shapeOf = i => SHAPE_ORDER[i % SHAPE_ORDER.length];
function drawBloom(tx, ty, s, cols, shape, t){
  const col = i => colorOf(cols[i % cols.length]);
  const wob = Math.sin(t*.8)*.03;
  const ring = (fn, n = 5, off = 0) => {
    for (let i=0;i<n;i++){
      ctx.save(); ctx.translate(tx, ty); ctx.rotate(i/n*Math.PI*2 - Math.PI/2 + off + wob);
      ctx.fillStyle = col(i); ctx.beginPath(); fn(); ctx.fill(); ctx.restore();
    }
  };
  const center = (c, r) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(tx, ty, r*s, 0, 7); ctx.fill(); };
  if (shape === 0){ // 둥근 꽃
    ring(() => ctx.ellipse(0, -17*s, 11*s, 17*s, 0, 0, 7));
    center('#f6d26a', 9);
  } else if (shape === 1){ // 별꽃: 뾰족한 꽃잎
    ring(() => { ctx.moveTo(0,0); ctx.quadraticCurveTo(11*s,-14*s,0,-36*s); ctx.quadraticCurveTo(-11*s,-14*s,0,0); });
    center('#fff3c4', 7); center('#f2b84b', 3.5);
  } else if (shape === 2){ // 벚꽃: 끝이 오목한 꽃잎
    ring(() => { ctx.moveTo(0,0); ctx.bezierCurveTo(15*s,-8*s,14*s,-27*s,5*s,-31*s); ctx.lineTo(0,-25*s); ctx.lineTo(-5*s,-31*s); ctx.bezierCurveTo(-14*s,-27*s,-15*s,-8*s,0,0); });

    ctx.fillStyle = '#d98a9a';
    for (let i=0;i<5;i++){ const a = i/5*Math.PI*2; ctx.beginPath(); ctx.arc(tx+Math.cos(a)*9*s, ty+Math.sin(a)*9*s, 1.6*s, 0, 7); ctx.fill(); }
  } else if (shape === 3){ // 튤립: 컵 모양
    const cy = ty - 14*s;
    [[-9,-.28,0],[9,.28,1],[0,0,2],[-6,-.12,3],[6,.12,4]].forEach(([dx,r,i], k) => {
      ctx.save(); ctx.translate(tx + dx*s, cy + (k > 2 ? 4*s : 0)); ctx.rotate(r + wob);

    for (let i=0;i<5;i++){

      ctx.fillStyle = col(i); ctx.beginPath(); ctx.arc(tx + Math.cos(a)*13*s, ty - 6*s + Math.sin(a)*13*s, 12*s, 0, 7); ctx.fill();
    }
    ctx.fillStyle = col(2); ctx.beginPath(); ctx.arc(tx, ty - 6*s, 11*s, 0, 7); ctx.fill();

    for (let i=0;i<6;i++){ const a = i/6*Math.PI*2; ctx.beginPath(); ctx.arc(tx + Math.cos(a)*13*s, ty - 6*s + Math.sin(a)*13*s, 1.8*s, 0, 7); ctx.fill(); }
  }
}
function drawPlant(x, y, stage, cols, s, t, shape = 0){
  const sway = Math.sin(t*1.1 + x*.01) * 3 * s;
  ctx.fillStyle = '#8b6a50';
  ctx.beginPath(); ctx.ellipse(x, y, 34*s, 10*s, 0, Math.PI, 0); ctx.fill();

    ctx.fillStyle = '#a0764f'; ctx.beginPath(); ctx.ellipse(x, y-7*s, 7*s, 5*s, -.3, 0, 7); ctx.fill();
    return;
  }
  const h = [0,24,55,90,115,125][stage] * s;
  const tx = x + sway, ty = y - h;
  ctx.strokeStyle = '#6a9a55'; ctx.lineWidth = Math.max(1.5, 4*s); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y-4*s); ctx.quadraticCurveTo(x - sway*.5, y - h*.5, tx, ty); ctx.stroke();
  const at = k => [x + sway*k*k, y - h*k];
  if (stage === 1){ leaf(tx, ty, 16, -2.6, s); leaf(tx, ty, 16, -.5, s); return; }
  let [lx,ly] = at(.45); leaf(lx, ly, 26, -2.7, s); leaf(lx, ly, 26, -.45, s);
  if (stage >= 3){ [lx,ly] = at(.72); leaf(lx, ly, 22, -2.4, s); leaf(lx, ly, 22, -.75, s); }
  if (stage === 2){ leaf(tx, ty, 10, -2.2, s); leaf(tx, ty, 10, -.9, s); return; }
  if (stage === 3){ leaf(tx, ty, 12, -2.2, s); leaf(tx, ty, 12, -.9, s); return; }
  const c = colorOf(cols[cols.length-1]);
  if (stage === 4){
    ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(tx, ty-12*s, 9*s, 14*s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#7fb069';
    ctx.beginPath(); ctx.moveTo(tx-10*s, ty-4*s); ctx.quadraticCurveTo(tx, ty+4*s, tx+10*s, ty-4*s); ctx.lineTo(tx, ty-12*s); ctx.fill();
    return;
  }
  // 활짝 핀 꽃: 꽃잎 하나하나가 물 준 날의 마음 색
  drawBloom(tx, ty, s, cols, shape, t);
}

let prev = performance.now();

}

      const sc = cl.s*big, puffs = v.bigClouds ? [[0,0,22],[24,-14,20],[48,-6,24],[70,2,18],[30,6,20]] : [[0,0,22],[24,-8,18],[46,0,20]];

    }
  }

    ctx.strokeStyle = 'rgba(50,40,70,.75)'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    const span = W + 260, lead = ((t*22) % span) - 130, by = H*.075;
    [[0,0],[-22,12],[-22,-12],[-44,24],[-44,-24],[-66,36]].forEach(([dx, dy], i) => {
      drawBird(lead + dx*1.4, by + dy*1.4 + Math.sin(t*1.2 + i)*2, 1.6, Math.sin(t*6 + i*.8));
    });

    [[0,0],[-18,9],[-18,-9]].forEach(([dx, dy], i) => drawBird(lead2 + dx*1.2, H*.15 + dy*1.2, 1.15, Math.sin(t*6.5 + i)));
  }

  [[0, .035, .004, 1.2], [1, .06, .007, .4], [2, .1, .005, 2.1]].forEach(([i, up, f, ph]) => {
    ctx.fillStyle = c.hill[i]; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 16) ctx.lineTo(x, base + H*.04*i - H*up*(1 + Math.sin(x*f + ph))*.6);
    ctx.lineTo(W, H); ctx.fill();
  });

    for (let i = 0; i < 4; i++){
      const fy = H*(.6 + i*.08), off = Math.sin(t*.15 + i*1.7)*W*.08;
      const fg = ctx.createLinearGradient(0, fy - H*.06, 0, fy + H*.06);

  const fl = bloomedList(), n = Math.min(fl.length, Math.max(3, Math.floor(W/46)));
  const shown = fl.slice(-n), gy = x => base + H*.08 - H*.1*(1 + Math.sin(x*.005 + 2.1))*.6;
  shown.forEach((f, i) => {
    const x = W*(i + .5)/n + Math.sin(i*2.3)*8, y = gy(x) + 8, h = 26 + (i*7 % 14), sw = Math.sin(t*1.1 + i)*2;
    ctx.strokeStyle = '#4f8a4f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x, y - h*.5, x + sw, y - h); ctx.stroke();

  const slow = p === 'night' && !v.snow;
  for (const pt of S.petals){
    const sp = v.seeds ? .45 : v.snow ? .6 : 1;
    pt.y += pt.vy*dt*(slow ? .25 : sp); pt.x += (pt.vx*(slow ? .3 : sp) + Math.sin(t*.8 + pt.ph)*14)*dt; pt.rot += pt.vr*dt*(v.seeds ? .3 : 1);
    if (pt.y > H + 20 || pt.x > W + 20){ pt.y = rnd(-60, -10); pt.x = rnd(-W*.2, W); }
    if (v.snow){
      const fr = 2.2 + (pt.ph % 1)*2.6, fg = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, fr*1.8);
      fg.addColorStop(0, 'rgba(255,255,255,.95)'); fg.addColorStop(.55, 'rgba(255,255,255,.7)'); fg.addColorStop(1, 'rgba(255,255,255,0)');

      continue;
    }
    if (p === 'night'){
      const a = .3 + .6*Math.abs(Math.sin(t*1.3 + pt.ph));

      fg.addColorStop(0, `rgba(240,255,170,${a})`); fg.addColorStop(1, 'rgba(240,255,170,0)');

    }

      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, r*1.3); ctx.stroke();

      ctx.fillStyle = '#c8b48a'; ctx.beginPath(); ctx.arc(0, r*1.3, 1.4, 0, 7); ctx.fill();

    }
    ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot); ctx.scale(1, .55 + .45*Math.sin(t*1.5 + pt.ph));
    ctx.fillStyle = v.blossom ? (pt.ph > 3 ? '#f9c6d6' : '#fde3ea') : pt.c; ctx.globalAlpha = .85;

    ctx.restore();
  }
}
function drawHome(t){

  g.addColorStop(0,th.grad[0]); g.addColorStop(.5,th.grad[1]); g.addColorStop(1,th.grad[2]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const blobs = th.blobs;
  blobs.forEach(([bx,by,c],i) => {
    const x = W*bx + Math.sin(t*.3+i)*30, y = H*by + Math.cos(t*.25+i)*30, r = Math.max(W,H)*.35;

  });
  // 흩날리는 꽃잎
  const dt = 1/60;
  for (const p of S.petals){
    p.y += p.vy*dt; p.x += (p.vx + Math.sin(t*.8 + p.ph)*14)*dt; p.rot += p.vr*dt;
    if (p.y > H+20 || p.x > W+20){ p.y = rnd(-60,-10); p.x = rnd(-W*.2, W); }

    ctx.restore();

}

/* ===== 소리 (직접 만들어 내는 자연음) ===== */
let AC = null, cur = null;
function noise(kind){
  const len = AC.sampleRate*3, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  let last = 0;
  for (let i=0;i<len;i++){
    const w = Math.random()*2-1;
    if (kind === 'brown'){ last = (last + .02*w)/1.02; d[i] = last*3.5; } else d[i] = w;
  }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true; return src;
}
function startSound(kind){
  stopSound();
  if (!soundOn || !kind) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    AC.resume();
    const out = AC.createGain(); out.gain.value = 0; out.connect(AC.destination);
    const nodes = [out];
    if (kind === 'rain'){
      const n = noise('white'), hp = AC.createBiquadFilter(), lp = AC.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 500; lp.type = 'lowpass'; lp.frequency.value = 5000;
      n.connect(hp).connect(lp).connect(out); n.start(); nodes.push(n);
      out.gain.linearRampToValueAtTime(.09, AC.currentTime + 2);
    } else if (kind === 'lake'){ // 민들레 들판: 살랑이는 바람 + 가끔 새소리
      const n = noise('brown'), lp = AC.createBiquadFilter(), sw = AC.createGain();
      lp.type = 'lowpass'; lp.frequency.value = 500; sw.gain.value = .5;
      const lfo = AC.createOscillator(), lg = AC.createGain();
      lfo.frequency.value = .1; lg.gain.value = .2; lfo.connect(lg).connect(sw.gain);
      n.connect(lp).connect(sw).connect(out); n.start(); lfo.start(); nodes.push(n, lfo);
      out.gain.linearRampToValueAtTime(.05, AC.currentTime + 3); // 바람은 아주 작게, 새소리가 들리도록
      const next = () => { S.chirpT = setTimeout(() => { chirp(.02); next(); }, rnd(3500, 9000)); }; // 들판 새소리는 조금 작게
      next();
    } else if (kind === 'sea'){
      const n = noise('brown'), lp = AC.createBiquadFilter(), sw = AC.createGain();
      lp.type = 'lowpass'; lp.frequency.value = 900; sw.gain.value = .5;
      const lfo = AC.createOscillator(), lg = AC.createGain();
      lfo.frequency.value = .09; lg.gain.value = .45; lfo.connect(lg).connect(sw.gain);
      n.connect(lp).connect(sw).connect(out); n.start(); lfo.start(); nodes.push(n, lfo);
      out.gain.linearRampToValueAtTime(.45, AC.currentTime + 2);
    } else if (kind === 'candle' || kind === 'blanket'){
      const n = noise('brown'), lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 260;
      n.connect(lp).connect(out); n.start(); nodes.push(n);
      out.gain.linearRampToValueAtTime(.25, AC.currentTime + 2);
    } else if (kind === 'hill'){
      const n = noise('white'), bp = AC.createBiquadFilter(), wg = AC.createGain();
      bp.type = 'bandpass'; bp.frequency.value = 260; bp.Q.value = .8; wg.gain.value = .05;
      n.connect(bp).connect(wg).connect(out); n.start(); nodes.push(n);
      S.wbp = bp; S.wg = wg;
      out.gain.linearRampToValueAtTime(.6, AC.currentTime + 1.5);
    } else if (kind === 'bamboo'){ // 댓잎이 사각거리는 소리
      const n = noise('white'), bp = AC.createBiquadFilter(), sw = AC.createGain();
      bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = .6; sw.gain.value = .5;
      const lfo = AC.createOscillator(), lg = AC.createGain();
      lfo.frequency.value = .15; lg.gain.value = .35; lfo.connect(lg).connect(sw.gain);
      n.connect(bp).connect(sw).connect(out); n.start(); lfo.start(); nodes.push(n, lfo);
      out.gain.linearRampToValueAtTime(.05, AC.currentTime + 2);
    } else if (kind === 'roof'){
      const n = noise('brown'), lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 380;
      n.connect(lp).connect(out); n.start(); nodes.push(n);
      out.gain.linearRampToValueAtTime(.18, AC.currentTime + 2);
    } else if (kind === 'yard'){
      const n = noise('brown'), lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 600;
      n.connect(lp).connect(out); n.start(); nodes.push(n);
      out.gain.linearRampToValueAtTime(.12, AC.currentTime + 2);
      const next = () => { S.chirpT = setTimeout(() => { chirp(); next(); }, rnd(2500, 7000)); };
      next();
    }
    cur = nodes;
  } catch(e){}
}
function patSound(){
  if (!soundOn) return;

    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.3, t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + .3);

/* --- 잔잔한 배경음악 (코드로 직접 연주) --- */
let music = null;
// 피아노 분산화음 곡: Fmaj7 → Em7 → Dm7 → Cmaj7 (한 마디 8박, 1박 0.9초)
// [왼손 낮은 음, 오른손 분산화음 4음, 그 화음에 어울리는 멜로디 음들]
const PIANO_BARS = [
  [174.61, [261.63,329.63,440,523.25], [659.25,523.25,587.33]],
  [164.81, [246.94,293.66,392,493.88], [587.33,493.88,659.25]],
  [146.83, [220,261.63,349.23,440],    [523.25,440,587.33]],
  [130.81, [246.94,329.63,392,523.25], [659.25,587.33,493.88]],
];
const BEAT = .9;
// 피아노 소리 한 음: 배음 여러 개를 겹치고, 높은 배음일수록 빨리 사라지게
function pianoNote(f, t, v){
  const dest = music.in;
  const dec = 4.5 * Math.pow(261.63 / f, .45); // 낮은 음일수록 길게 울림
  t += rnd(0, .025); // 사람이 치는 것처럼 아주 조금씩 어긋나게
  [[1,1,1],[2,.42,.6],[3,.2,.4],[4,.1,.28],[5,.05,.2]].forEach(([h, a, d]) => {
    const o = AC.createOscillator(), g = AC.createGain(), peak = .16 * v * a;
    o.type = 'sine'; o.frequency.value = f * h * (1 + .0004*h*h);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + .005);
    g.gain.exponentialRampToValueAtTime(peak * .3, t + .05 + .3*d);
    g.gain.exponentialRampToValueAtTime(.0001, t + dec*d);
    o.connect(g).connect(dest); o.start(t); o.stop(t + dec*d + .05);
  });
}
// 방 안에 울리는 느낌(잔향)
function makeReverb(sec){
  const len = Math.floor(AC.sampleRate * sec), buf = AC.createBuffer(2, len, AC.sampleRate);
  for (let c=0;c<2;c++){ const d = buf.getChannelData(c); for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3); }
  const cv = AC.createConvolver(); cv.buffer = buf; return cv;
}
const musicLevel = () => (['home','garden'].includes(scene) ? .8 : 0); // 감정 공간에서는 음악을 멈추고 그 공간의 소리만
function startMusic(){
  if (!soundOn || music) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume();
    const g = AC.createGain(); g.gain.value = 0; g.connect(AC.destination);
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    const rv = makeReverb(2.8), wet = AC.createGain(); wet.gain.value = .45;
    lp.connect(g); lp.connect(rv); rv.connect(wet).connect(g);
    music = {g, in:lp, i:0, next:AC.currentTime + .2};
    g.gain.linearRampToValueAtTime(musicLevel(), AC.currentTime + 4);
    music.timer = setInterval(scheduleMusic, 500); scheduleMusic();
  } catch(e){}
}
function scheduleMusic(){
  if (!music) return;
  while (music.next < AC.currentTime + 2){
    const t0 = music.next, [bass, arp, mel] = PIANO_BARS[music.i % PIANO_BARS.length];
    // 왼손: 마디 첫 박에 낮은 음
    pianoNote(bass, t0, .75);
    // 오른손: 올라갔다 내려오는 분산화음 (1~7박)
    [0,1,2,3,2,1,0].forEach((k, b) => pianoNote(arp[k], t0 + (b+1)*BEAT, .42 + (k === 3 ? .08 : 0)));
    // 멜로디: 두 마디에 한 번꼴로, 위에서 한두 음 살며시
    if (music.i % 2 === 0 || Math.random() < .3){
      pianoNote(mel[Math.floor(rnd(0, mel.length))], t0 + 2*BEAT, .55);
      if (Math.random() < .5) pianoNote(mel[Math.floor(rnd(0, mel.length))], t0 + 5*BEAT, .45);
    }
    music.i++; music.next += 8*BEAT;
  }
}
function setMusicLevel(){
  if (!music) return;

}
function stopMusic(){
  if (!music) return;
  const m = music; music = null; clearInterval(m.timer);
  try { m.g.gain.cancelScheduledValues(AC.currentTime); m.g.gain.setTargetAtTime(0, AC.currentTime, .3); setTimeout(() => m.g.disconnect(), 2000); } catch(e){}
}
// 브라우저는 사용자가 한 번 누르기 전에는 소리를 막아 두므로, 첫 터치 때 음악을 시작

function whoosh(){ // 후~ 하고 부는 바람 소리

      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + .09);

function chime(){

function stopSound(){

}

      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.12, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + .25);

let lineTimer = null;
function rotateLines(lines){

// 화면 폭에 한 줄로 안 들어가는 문장은 두 줄로 나눔.
// 문장 속 '|'는 문맥에 맞춰 직접 정해 둔 줄 바꿀 자리: 한 줄에 들어가면 띄어쓰기, 넘치면 줄바꿈.
// '|'가 없는 문장만 쉼표·마침표 뒤처럼 자연스러운 곳을 찾아 나눔.
const measureCtx = document.createElement('canvas').getContext('2d');
function smartBreak(text, el){
  if (!text || text.includes('\n')) return text;
  const cs = getComputedStyle(el);
  measureCtx.font = cs.font || `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const maxW = Math.min(520, innerWidth - 32) - 4; // 글씨 칸의 폭 (화면이 아직 안 보여도 계산되게)
  const w = t => measureCtx.measureText(t).width;
  if (text.includes('|')){
    const plain = text.split('|').join(' ');
    return w(plain) <= maxW ? plain : text.split('|').join('\n');
  }
  if (w(text) <= maxW) return text;
  let best = -1, bestScore = Infinity;
  for (let i = 1; i < text.length - 1; i++){
    if (text[i] !== ' ') continue;
    const a = text.slice(0, i), b = text.slice(i + 1);
    let score = Math.abs(w(a) - w(b));
    if (/[,.!?…]$/.test(a)) score -= maxW * .7;    // 쉼표·마침표 뒤에서 끊는 것을 더 좋아함
    if (/(^| )\S$/.test(a)) score += maxW * .8;     // '이', '할'처럼 한 글자로 줄이 끝나지 않게
    if (/^(수|것|거|뿐|줄|적|데|때문)/.test(b)) score += maxW * .8; // '할 수', '견딘 것'처럼 붙어 다니는 말은 떼지 않게
    if (w(a) > maxW || w(b) > maxW) score += maxW * 2; // 나눠도 넘치면 피함
    if (score < bestScore){ bestScore = score; best = i; }
  }
  return best < 0 ? text : text.slice(0, best) + '\n' + text.slice(best + 1);
}

// 2·5·10·20·35·70송이, 그 뒤로는 35송이마다 꽃다발과 편지가 도착 (물 3번에 한 송이라 6·15·30·60·105·210일째)
const MILESTONES = [2, 5, 10, 20, 35, 70];
const isMilestone = n => MILESTONES.includes(n) || (n > 70 && n % 35 === 0);
const nextMilestone = c => MILESTONES.find(m => m > c) || (Math.floor(c/35)*35 + 35);
const BLOOM = 3; // 물을 몇 번 주면 꽃이 피는지
const growStage = n => n >= BLOOM ? 5 : [0, 2, 4][n]; // 물 준 횟수 → 그림 단계 (0 씨앗, 2 잎, 4 봉오리, 5 꽃)
function bloomedList(){ // 지금까지 활짝 핀 꽃 (몇 번째 꽃인지에 따라 모양이 정해짐)
  const list = G.flowers.map((cols, i) => ({cols, shape: shapeOf(i)}));
  if (G.seed.length >= BLOOM) list.push({cols: G.seed, shape: shapeOf(G.flowers.length)});
  return list;
}
function pendingGift(){ // 아직 못 받은 꽃다발 중 가장 큰 것 (이미 꽃을 많이 피운 사람은 한 번에 받음)
  const c = bloomedList().length;
  for (let n = c; n >= 1; n--) if (isMilestone(n) && !G.gifts.some(g => g.n === n)) return n;
  return 0;
}

// 꽃다발 그림: 뒤 포장지 → 줄기 → 잎 → 꽃 → 앞 포장지 → 리본
function drawBouquet(c, cx, cy, S, list, t){
  const prev = ctx; ctx = c; // drawBloom·leaf는 ctx에 그리므로 잠시 바꿈
  try {
    const bottom = cy + 230*S;
    c.fillStyle = '#f4e4cc';
    c.beginPath(); c.moveTo(cx, bottom); c.lineTo(cx - 178*S, cy - 30*S); c.quadraticCurveTo(cx, cy - 130*S, cx + 178*S, cy - 30*S); c.closePath(); c.fill();
    const k = Math.max(1, list.length), pts = [];
    list.forEach((f, i) => {
      const r = (list.length === 1 ? 0 : (60 + 6*Math.min(k, 12))*S*Math.sqrt((i + .5)/k)), a = i*2.39996 + .6;
      pts.push({x: cx + r*Math.cos(a), y: cy - 30*S + r*Math.sin(a)*.7, ...f});
    });
    c.strokeStyle = '#5f8f4a'; c.lineWidth = 4*S; c.lineCap = 'round';
    for (const p of pts){ c.beginPath(); c.moveTo(p.x, p.y); c.quadraticCurveTo((p.x + cx)/2, p.y + 70*S, cx + (p.x - cx)*.12, bottom - 50*S); c.stroke(); }
    for (let j=0;j<7;j++){
      const a = Math.PI*(1.08 + j*.14);
      leaf(cx + Math.cos(a)*120*S, cy - 10*S + Math.sin(a)*80*S, 46, a, S);
    }
    pts.sort((a, b) => a.y - b.y).forEach(p => drawBloom(p.x, p.y, 1.25*S, p.cols, p.shape, t));
    c.fillStyle = '#f7d2c4';
    c.beginPath(); c.moveTo(cx - 132*S, cy + 40*S); c.lineTo(cx + 132*S, cy + 40*S); c.lineTo(cx + 20*S, bottom); c.lineTo(cx - 20*S, bottom); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(170,110,90,.35)'; c.lineWidth = 2*S;
    c.beginPath(); c.moveTo(cx - 45*S, cy + 40*S); c.lineTo(cx - 6*S, bottom); c.moveTo(cx + 45*S, cy + 40*S); c.lineTo(cx + 6*S, bottom); c.stroke();
    const ry = cy + 150*S;
    c.fillStyle = '#e8796f';
    c.beginPath(); c.ellipse(cx - 27*S, ry, 27*S, 13*S, -.4, 0, 7); c.fill();
    c.beginPath(); c.ellipse(cx + 27*S, ry, 27*S, 13*S, .4, 0, 7); c.fill();
    c.beginPath(); c.moveTo(cx - 5*S, ry); c.lineTo(cx - 30*S, ry + 52*S); c.lineTo(cx - 14*S, ry + 47*S); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(cx + 5*S, ry); c.lineTo(cx + 30*S, ry + 52*S); c.lineTo(cx + 14*S, ry + 47*S); c.closePath(); c.fill();
    c.fillStyle = '#d65f4f'; c.beginPath(); c.arc(cx, ry, 9*S, 0, 7); c.fill();
  } finally { ctx = prev; }
}

// 꽃다발 카드 그림 (1080×1350, SNS·사진첩용)
async function makeCard(n, d){
  try { await Promise.all([document.fonts.load("700 92px 'Hahmlet'"), document.fonts.load("500 40px 'Hahmlet'")]); } catch(e){}
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
  const x = c.getContext('2d');
  const th = HOME_THEMES.green;
  let g = x.createLinearGradient(0, 0, 1080, 1350);
  g.addColorStop(0, th.grad[0]); g.addColorStop(.5, th.grad[1]); g.addColorStop(1, th.grad[2]);
  x.fillStyle = g; x.fillRect(0, 0, 1080, 1350);
  th.blobs.forEach(([bx, by, col]) => {
    const rg = x.createRadialGradient(1080*bx, 1350*by, 0, 1080*bx, 1350*by, 520);
    rg.addColorStop(0, `rgba(${col},.55)`); rg.addColorStop(1, `rgba(${col},0)`);
    x.fillStyle = rg; x.fillRect(0, 0, 1080, 1350);
  });
  x.textAlign = 'center'; x.lineJoin = 'round';
  x.font = "700 96px 'Hahmlet', serif";
  x.strokeStyle = 'rgba(12,24,18,.9)'; x.lineWidth = 12; x.strokeText('널쓰담', 540, 165);
  x.fillStyle = '#fff'; x.fillText('널쓰담', 540, 165);
  x.font = "700 42px 'Hahmlet', serif"; x.fillStyle = '#17382a';
  x.fillText(`꽃 ${n}송이를 피운 당신에게`, 540, 240);
  drawBouquet(x, 540, 520, 1.55, bouquetFor(n), 0);
  x.fillStyle = 'rgba(255,253,248,.92)';
  x.beginPath(); x.roundRect ? x.roundRect(100, 905, 880, 290, 40) : x.rect(100, 905, 880, 290); x.fill();
  x.font = "700 36px 'Hahmlet', serif"; x.fillStyle = '#221b31';
  letterFor(n).split('\n').forEach((ln, i) => x.fillText(ln, 540, 985 + i*68));
  x.font = "700 30px 'Hahmlet', serif"; x.fillStyle = '#17382a';
  x.fillText(`${dateKo(d)} · nursedam.kr`, 540, 1240);
  x.font = "700 26px 'Hahmlet', serif";
  x.fillText('Created by 해안AI간호교육연구소', 540, 1284);
  x.font = "500 22px 'Hahmlet', serif"; x.fillStyle = 'rgba(23,56,42,.75)';
  x.fillText('nursing.ai.kr', 540, 1320);
  return c;
}
async function saveCard(n, d, btn){
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '카드 만드는 중…';
  try {
    const c = await makeCard(n, d);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    const name = `널쓰담_꽃다발_${n}송이.png`;
    const file = new File([blob], name, {type: 'image/png'});
    let shared = false;
    // 휴대폰: 공유 창에서 '이미지 저장'이나 카카오톡 보내기를 고를 수 있게
    if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files: [file]})){
      try { await navigator.share({files: [file], title: '널쓰담 꽃다발'}); shared = true; }
      catch(e){ if (e.name === 'AbortError') shared = true; }
    }
    if (!shared){ // 컴퓨터(또는 공유가 안 될 때): 파일로 내려받기
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
    btn.textContent = '저장했어요';
  } catch(e){ btn.textContent = label; }
  btn.disabled = false;
}

const RXBAG = 'nursedam_rx_bag', RXLAST = 'nursedam_rx_last';
let rxMem = { bag: [], last: -1 }; // 저장이 안 되는 브라우저용
function rxNext(){
  let bag = rxMem.bag, last = rxMem.last;
  try { bag = JSON.parse(localStorage.getItem(RXBAG)) || []; last = Number(localStorage.getItem(RXLAST) ?? -1); } catch(e){}
  bag = bag.filter(i => Number.isInteger(i) && i >= 0 && i < RX.length);
  if (!bag.length) bag = RX.map((_, i) => i).filter(i => i !== last); // 한 바퀴 다 돌면 새로 채우기 (방금 본 건 빼고)
  const i = bag.splice(Math.floor(Math.random() * bag.length), 1)[0];
  rxMem = { bag, last: i };
  try { localStorage.setItem(RXBAG, JSON.stringify(bag)); localStorage.setItem(RXLAST, String(i)); } catch(e){}
  return i;
}

/* ===== 숨은 손님 도감 (첫 화면 아래 링크에서 열림) ===== */
function critterIcon(id, found){
  const c = document.createElement('canvas'), dpr = Math.min(2, window.devicePixelRatio || 1), cw = 84, ch = 70;
  c.width = cw*dpr; c.height = ch*dpr; c.style.width = cw + 'px'; c.style.height = ch + 'px';
  const old = ctx; ctx = c.getContext('2d');
  try {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.translate(cw/2 - 2, ch - 12); ctx.scale(1.25, 1.25);
    drawCritter(id, .314, false); // .314: 나비 날개가 활짝 펴진 순간
    if (!found){ // 아직 못 찾은 손님은 그림자로
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = '#b9b2c6'; ctx.fillRect(0, 0, c.width, c.height);
    }
  } finally { ctx = old; }
  return c;
}
function openGuestBook(){
  const wrap = document.createElement('div'); wrap.className = 'panel';
  const box = document.createElement('div'); box.className = 'box';
  wrap.append(box); document.body.append(wrap);
  const close = () => wrap.remove();
  wrap.onclick = e => { if (e.target === wrap) close(); };
  const f = foundGuests();
  box.innerHTML = `<p class="panel-title">🐾 숨은 손님 도감</p><p class="panel-sub">공간마다 손님 세 마리가 숨어 있어요.<br>눌러서 인사하면 도감에 기록돼요. <b>${f.length} / ${GUEST_TOTAL}</b></p>`;
  for (const [sc, list] of Object.entries(GUESTS)){
    const sec = document.createElement('div'); sec.className = 'gb-sec';
    const h = document.createElement('p'); h.className = 'gb-place';
    const n = list.filter((_, i) => f.includes(sc + ':' + i)).length;
    h.textContent = `${GUEST_PLACE[sc]} · ${n}/${list.length}`; sec.append(h);
    const grid = document.createElement('div'); grid.className = 'gb-grid';
    list.forEach((g, i) => {
      const id = sc + ':' + i, ok = f.includes(id);
      const cell = document.createElement('div'); cell.className = 'gb-cell' + (ok ? '' : ' unknown');
      const nm = document.createElement('b'); nm.textContent = ok ? g.name : '???';
            cell.append(critterIcon(id, ok), nm);
      if (ok) cell.onclick = () => {
        const q = cell.querySelector('.gb-line'); if (q){ q.remove(); return; }
        const p = document.createElement('small'); p.className = 'gb-line';
        p.textContent = '“' + g.lines[Math.floor(Math.random()*g.lines.length)].replace('\n', ' ') + '”'; cell.append(p);
      };
      grid.append(cell);
    });
    sec.append(grid); box.append(sec);
  }
  const tip = document.createElement('p'); tip.className = 'panel-sub'; tip.style.marginTop = '12px';
  tip.textContent = f.length === GUEST_TOTAL ? '모든 손님을 만났어요! 다들 당신을 기다렸대요. 🐾' : '찾은 손님을 누르면 한마디를 들려줘요.';
  box.append(tip);
  const done = document.createElement('button'); done.className = 'main-btn'; done.textContent = '닫기'; done.style.marginTop = '6px';
  done.onclick = close;
  const c = document.createElement('div'); c.style.textAlign = 'center'; c.append(done); box.append(c);
}

      '젖은 마음은|천천히 마르면 돼요.', '오늘 하나만 내려놓는다면|무엇을 내려놓고 싶나요?', '잘 쉬는 것도|일만큼 중요해요.']);

  } else if (key === 'hurt'){

    const go = document.createElement('button'); go.className = 'main-btn'; go.textContent = '함께 숨 쉬기 (5번)';
    go.onclick = () => { breath = {start: performance.now()/1000, done:false}; go.remove(); };

  } else if (key === 'angry'){
    wind.lv = 0; wind.peak = 0; wind.hold = false; wind.said = '';

    hb.addEventListener('pointerdown', ev => { ev.preventDefault(); wind.hold = true; try { hb.setPointerCapture(ev.pointerId); } catch(e){} });
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev => hb.addEventListener(ev, () => wind.hold = false));

  } else if (key === 'lonely'){
    S.lit = []; roofI = 0;
    setLine('오늘 밤,|조금 외로웠나요?');
    $('#hint').innerHTML = '하늘 아무 곳이나 눌러 별을 켜 보세요.<br>별 하나에 따뜻한 말이 하나씩 들어 있어요.';

  } else if (key === 'selfhate'){
    lake.txt = null; lake.seeds = [];
    setLine('나를 미워하는 마음,\n바람에 실어 보내요.');
    $('#hint').innerHTML = '나에게 했던 모진 말을 적어 보세요.<br>민들레 홀씨처럼 바람에 날아가요.<br>간직하기를 켜 두면 이 기기에만 남아요.';
    const ta = document.createElement('textarea'); ta.rows = 2; ta.maxLength = 60;
    ta.placeholder = '예: 나는 왜 이것밖에 못 할까';
    const go = document.createElement('button'); go.className = 'main-btn'; go.textContent = '후~ 불어 날려 보내기';
    const keep = keepBox('selfhate'), past = diaryBtn('selfhate');
    go.onclick = () => {
      const txt = ta.value.trim();
      if (!txt){ ta.focus(); return; }
      if (keep.on()){ DIARY.push({d: today(), emo: 'selfhate', text: txt}); saveDiary(); past.upd(); }
      const t = performance.now()/1000;
      lake.txt = txt.length > 24 ? txt.slice(0,24) + '…' : txt; lake.born = t;
      const cy = H*.6 - 34, half = Math.min(W*.4, lake.txt.length*10);
      for (let i=0;i<70;i++) lake.seeds.push({x:W/2 + rnd(-half, half), y:cy + rnd(-14, 6), vx:rnd(30,90), vy:rnd(-45,-10), ph:rnd(0,6), life:rnd(3,5.5)});
      ta.value = ''; whoosh();
      setTimeout(() => { if (scene === 'lake') setLine(LAKE_LINES[lakeI++ % LAKE_LINES.length]); }, 1500);
    };
    act.append(ta, keep.el, go, past, careLine());
  } else if (key === 'vent'){
    vent.chars = []; vent.leaves = []; vent.gust = 0;
    setLine('여기선 아무 말이나|다 해도 돼요.');
    $('#hint').innerHTML = '<b class="privacy">여기 적은 말은 어디에도 저장되지 않아요.</b><br>욕이든 투정이든 실컷 외쳐 보세요.<br>대나무숲이 다 듣고, 바람에 날려 버려요.';

    ta.placeholder = '참았던 말, 다 쏟아내도 괜찮아요';
    const go = document.createElement('button'); go.className = 'main-btn'; go.textContent = '대나무숲에 외치기 📣';
    go.onclick = () => {
      const txt = ta.value.trim();
      if (!txt){ ta.focus(); return; }
      shout(txt); ta.value = ''; ta.blur(); whoosh(); setLine('');
      setTimeout(() => {
        if (scene !== 'bamboo') return;
        setLine(VENT_LINES[ventI++ % VENT_LINES.length]);
        if (!act.querySelector('.play-hint')) act.append(playHint('🎮 속 시원해졌다면, 놀이터도 있어요'));

// 촛불 호흡 글자
let lastCandle = '';
function candleText(t){
  if (!breath || breath.done) return;
  const el = t - breath.start, n = Math.floor(el/B_CYC), p = el % B_CYC;
  let msg;
  if (n >= 5){
    breath.done = true; breath = null;
    setLine('끝까지 잘 따라왔어요.|지금 몸은 어떤 느낌인가요?');
    $('#hint').textContent = '원하면 언제든 다시 해도 괜찮아요';
    return;
  }
  msg = p < B_IN ? '천천히 들이쉬어요' : '길게 내쉬어요';
  const txt = msg + '  ·  ' + (n+1) + ' / 5';
  if (txt !== lastCandle){ lastCandle = txt; setLine(msg); $('#hint').textContent = (n+1) + ' / 5'; }
}

function openGarden(){
  scene = 'garden'; breath = null; clearInterval(lineTimer); lineTimer = null;
  document.body.classList.remove('dark');
  stopSound(); setMusicLevel();
  const d = today(), gap = daysBetween(G.visit, d);
  let msg;
  if (!G.visit) msg = '씨앗 하나를 받았어요.|들를 때마다 물을 주세요.';
  else if (gap >= 3) msg = '오랜만이에요.|정원은 시들지 않고 기다리고 있었어요.';
  else if (waterLeft() === 0 && !TEST) msg = '오늘은 물을 다 줬어요.|내일 또 만나요.';
  else msg = '오늘도 와 줘서 고마워요.';
  G.visit = d; saveG();
  $('#gMsg').textContent = smartBreak(msg, $('#gMsg'));
  refreshGarden();
  show('garden');
  const g = pendingGift(); // 아직 못 받은 꽃다발이 있으면 (이미 꽃을 많이 피운 사람 포함)
  if (g) setTimeout(() => { if (scene === 'garden' && !document.querySelector('.panel')) showGift(g); }, 900);
  rollGuest();
}
function refreshGarden(){
  const count = bloomedList().length;
  $('#gCount').textContent = '🌸 피운 꽃 ' + count + '송이' + (G.gifts.length ? ' · 🎁 ' + G.gifts.length : '');
  const n = G.seed.length;
  $('#gProgress').innerHTML = (n >= BLOOM ? '활짝 피었어요 · 다음에 물을 주면 새 씨앗이 자라요'
    : '꽃이 피기까지 물 ' + n + ' / ' + BLOOM)
    + `<br><span class="gift-line">🎁 다음 꽃다발까지 ${nextMilestone(count) - count}송이</span>`;
  const left = waterLeft(), can = TEST || left > 0;
  const btn = $('#waterBtn');
  btn.disabled = !can;
  btn.textContent = !can ? '내일 또 물 줄 수 있어요' : left === 1 && !TEST ? '물 주기 (오늘 1번 더)' : '물 주기';
  const lg = $('#legend'); lg.innerHTML = '';
  [...Object.values(EMO).map(e => [e.label, e.color]), ['정원에 바로 온 날', NEUTRAL]].forEach(([l,c]) => {
    const s = document.createElement('span'); s.style.setProperty('--c', c); s.textContent = l; lg.append(s);
  });
}
// 하루에 물 줄 수 있는 횟수 (G.last: 마지막으로 물 준 날, G.n: 그날 준 횟수)
function waterLeft(){ const per = 2; return G.last === today() ? Math.max(0, per - (G.n || 1)) : per; }
$('#waterBtn').onclick = () => {
  if (!(TEST || waterLeft() > 0)) return;
  const usedToday = G.last === today() ? (G.n || 1) : 0;
  if (G.seed.length >= BLOOM){ G.flowers.push(G.seed); G.seed = []; }
  G.seed.push(todayEmo || 'none');
  G.n = usedToday + 1; G.last = today(); saveG();
  drip();
  const u = plantScale();
  for (let i=0;i<14;i++) S.rainfx.push({x:W/2 + rnd(-40,40)*u, y:GROUND() - 220*u - rnd(0,100), v:rnd(40,120)});
  const msgs = ['', '싹이 나고|잎이 두 장 나왔어요.', '꽃봉오리가 생겼어요.|다음에 피어날 거예요.'];
  setTimeout(() => {
    $('#gMsg').textContent = G.seed.length === BLOOM
      ? `꽃이 피었어요! 이번엔 ${SHAPES[shapeOf(G.flowers.length)]}이에요.\n그동안의 마음이 꽃잎이 되었어요.`
      : smartBreak(msgs[G.seed.length], $('#gMsg'));
    if (G.seed.length === BLOOM){
      const ty = GROUND() - 125*u;
      for (let i=0;i<30;i++) S.spark.push({x:W/2, y:ty, vx:rnd(-90,90), vy:rnd(-120,40), life:rnd(.8,1.6)});
      const g = pendingGift(); // 정해진 송이 수에 닿았으면 꽃다발 선물
      if (g) setTimeout(() => { if (scene === 'garden') showGift(g); }, 1800);
    }
  }, 700);
  refreshGarden();
};
$('#gCount').onclick = () => openGiftBox();

    <a class="play-card" href="https://nyangpang.vercel.app" target="_blank" rel="noopener">

      <span class="go">하러 가기 →</span></a>

      <span class="go">하러 가기 →</span></a>
    <p class="panel-sub" style="margin-top:12px">새 창으로 열려요.<br>다 놀면 이 창으로 돌아오세요 🌿</p>`;

$('#toPlay').onclick = openPlay;

// 글쓰기 칸: 글이 길어지면 칸이 늘어나고, 휴대폰 자판이 올라와도 칸이 가려지지 않게 화면을 살짝 올림
function growTA(ta){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, 190) + 'px'; }
function fitTyping(){
  const ta = document.activeElement;
  document.querySelectorAll('.screen').forEach(sc => { if (!ta || !sc.contains(ta)) sc.style.transform = ''; });
  if (!ta || ta.tagName !== 'TEXTAREA') return;
  const sc = ta.closest('.screen'); if (!sc) return;
  const vv = window.visualViewport, bottom = vv ? vv.height + vv.offsetTop : innerHeight;
  const cur = parseFloat((sc.style.transform.match(/-?[\d.]+/) || [0])[0]) || 0;
  const r = ta.getBoundingClientRect(), top0 = r.top - cur, bot0 = r.bottom - cur;
  const shift = Math.min(Math.max(0, bot0 + 12 - bottom), Math.max(0, top0 - 70));
  sc.style.transform = shift ? `translateY(${-shift}px)` : '';
}
document.addEventListener('input', e => { if (e.target.tagName === 'TEXTAREA'){ growTA(e.target); fitTyping(); } });
document.addEventListener('focusin', e => { if (e.target.tagName === 'TEXTAREA'){ growTA(e.target); setTimeout(fitTyping, 300); } });
document.addEventListener('focusout', () => setTimeout(fitTyping, 50));
document.addEventListener('click', () => setTimeout(() => document.querySelectorAll('textarea').forEach(t => { if (!t.value) t.style.height = ''; }), 60)); // 보낸 뒤 비워진 칸은 원래 크기로
if (window.visualViewport){ visualViewport.addEventListener('resize', fitTyping); visualViewport.addEventListener('scroll', fitTyping); }

// 문의 메일 주소: 누르면 복사
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 1900);
}
$('#mailCopy').onclick = async () => {
  const mail = 'naya5403@naver.com';
  try { await navigator.clipboard.writeText(mail); }
  catch(e){ // 예전 브라우저용

  }
  toast('메일 주소를 복사했어요');

Object.entries(EMO).forEach(([k,e]) => {
